<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Portal – Sign In</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/dev.css">
</head>
<body class="dev-body dev-login-body">
  <main class="dev-login-card">
    <div class="dev-mark">DP</div>
    <h1>Developer Portal</h1>
    <p class="dev-sub">Restricted access. Enter the portal key to continue.</p>
    <form id="devLoginForm" autocomplete="off">
      <div class="dev-field">
        <label for="devSecret">Access Key</label>
        <input type="password" id="devSecret" required autocomplete="off">
      </div>
      <button type="submit" class="dev-btn dev-btn--primary" id="devSubmitBtn">Sign In</button>
    </form>
    <div id="devMsg" class="dev-alert dev-hidden"></div>
  </main>
  <script>
    function show(el, kind, text) {
      el.className = 'dev-alert dev-alert--' + kind;
      el.textContent = text;
      el.classList.remove('dev-hidden');
    }
    document.getElementById('devLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('devSubmitBtn');
      const msg = document.getElementById('devMsg');
      btn.disabled = true; btn.textContent = 'Verifying…';
      try {
        const r = await fetch('/dev/login', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ secret: document.getElementById('devSecret').value }),
        });
        const d = await r.json();
        if (r.ok && d.ok) {
          location.href = '/dev';
        } else {
          show(msg, 'error', d.error || 'Access denied.');
          document.getElementById('devSecret').value = '';
        }
      } catch {
        show(msg, 'error', 'Network error.');
      } finally {
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>

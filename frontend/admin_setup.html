<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Setup – Simon Fresh Water</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-body">
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo-drop">💧</div>
        <h1>Simon Fresh Water</h1>
        <p>First-Time Admin Setup</p>
      </div>

      <p class="form-hint-small">
        Create the primary administrator account. You'll need the
        <strong>ADMIN_SETUP_CODE</strong> from the server environment.
      </p>

      <form id="setupForm" class="auth-form">
        <div class="form-row">
          <label for="setupCode">Setup Code *</label>
          <input type="text" id="setupCode" required placeholder="From server env">
        </div>
        <div class="form-row">
          <label for="username">Admin Username *</label>
          <input type="text" id="username" required minlength="3" placeholder="e.g. simon_admin">
        </div>
        <div class="form-row">
          <label for="password">Password * (min 8 chars)</label>
          <input type="password" id="password" required minlength="8" autocomplete="new-password">
        </div>
        <div class="form-row">
          <label for="phone">Recovery Phone (SMS OTP) *</label>
          <input type="text" id="phone" required placeholder="e.g. 0791389935">
        </div>
        <div class="form-row">
          <label for="email">Recovery Email (optional)</label>
          <input type="email" id="email" placeholder="e.g. admin@simonfreshwater.co.ke">
        </div>
        <button type="submit" class="btn-primary btn-full" id="setupBtn">Create Admin</button>
      </form>

      <div id="setupMsg" class="alert hidden"></div>

      <div class="auth-footer">
        <a href="/admin/login" class="auth-link">Already set up? Sign in</a>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('setupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('setupBtn');
      const msg = document.getElementById('setupMsg');
      btn.disabled = true;
      btn.textContent = 'Creating…';
      msg.classList.add('hidden');

      try {
        const r = await fetch('/api/admin/setup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            setup_code: document.getElementById('setupCode').value.trim(),
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
            phone: document.getElementById('phone').value.trim(),
            email: document.getElementById('email').value.trim(),
          }),
        });
        const data = await r.json();
        if (r.ok && data.ok) {
          msg.className = 'alert alert-success';
          msg.textContent = '✅ Admin created. Redirecting…';
          msg.classList.remove('hidden');
          setTimeout(() => { location.href = '/'; }, 800);
        } else {
          msg.className = 'alert alert-error';
          msg.textContent = data.error || 'Setup failed.';
          msg.classList.remove('hidden');
          btn.disabled = false;
          btn.textContent = 'Create Admin';
        }
      } catch {
        msg.className = 'alert alert-error';
        msg.textContent = 'Network error.';
        msg.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Create Admin';
      }
    });
  </script>
</body>
</html>

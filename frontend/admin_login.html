<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – {{brand_name}}</title>

  <!-- Open Graph / social preview meta tags (Phase 10) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{brand_name}}">
  <meta property="og:title" content="Admin Login - {{brand_name}}">
  <meta property="og:description" content="Sign in to the {{brand_name}} utility billing portal">
  <meta property="og:url" content="{{brand_base_url}}/admin/login?__tenant={{tenant_slug}}">
  <meta property="og:image" content="{{brand_base_url}}{{brand_favicon_url}}?size=512">
  <meta property="og:image:secure_url" content="{{brand_base_url}}{{brand_favicon_url}}?size=512">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="{{brand_name}} logo">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Admin Login - {{brand_name}}">
  <meta name="twitter:description" content="Sign in to the {{brand_name}} utility billing portal">
  <meta name="twitter:image" content="{{brand_base_url}}{{brand_favicon_url}}?size=512">
  <link rel="icon" type="image/png" sizes="32x32" href="{{brand_favicon_url}}?v={{tenant_slug}}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{brand_favicon_url}}?size=192&v={{tenant_slug}}">
  <link rel="shortcut icon" href="{{brand_favicon_url}}?v={{tenant_slug}}">
  <link rel="apple-touch-icon" href="{{brand_favicon_url}}?size=192&v={{tenant_slug}}">
  <link rel="manifest" href="/manifest.webmanifest?__tenant={{tenant_slug}}">
  <meta name="theme-color" content="#0d47a1">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Inactive-tenant mode — login is visible but disabled */
    body.tenant-inactive #loginForm input,
    body.tenant-inactive #loginForm button,
    body.tenant-inactive #otpForm input,
    body.tenant-inactive #otpForm button {
      opacity: .55;
      cursor: not-allowed;
      pointer-events: none;
    }
    body.tenant-inactive #loginBtn,
    body.tenant-inactive #otpBtn {
      background: #90a4ae;
    }
    .tenant-inactive-note {
      display: none;
      margin-top: 1rem;
      padding: .85rem 1rem;
      border-radius: 10px;
      background: #fff3e0;
      border: 1px solid #ffb74d;
      color: #6d4c00;
      font-size: .9rem;
      line-height: 1.5;
    }
    .tenant-inactive-note strong { color: #4e342e; }
    body.tenant-inactive .tenant-inactive-note { display: block; }
    .tenant-inactive-note .note-icon { margin-right: .35rem; }
    /* Inactive tenant: hide the footer links (Forgot password? / Back to site)
       so the disabled login page has no escape routes. */
    body.tenant-inactive .auth-footer { display: none; }
  </style>
</head>
<body class="auth-body" data-tenant-slug="{{tenant_slug}}">
  <main class="auth-main">
    <div class="auth-card">
      <a href="/" class="brand-link" aria-label="Go to home"><div class="auth-brand">
        <img class="brand-logo" src="{{brand_logo_url}}" alt="{{brand_name}}">
        <h1>{{brand_name}}</h1>
        <p>Admin Sign In</p>
      </div></a>

      <!-- STEP 1: password -->
      <div id="step1">
        <form id="loginForm" class="auth-form">
          <div class="form-row">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" required>
          </div>
          <div class="form-row">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn-primary btn-full" id="loginBtn">Sign In</button>
        </form>
      </div>

      <!-- STEP 2: OTP (hidden unless 2FA is required) -->
      <div id="step2" class="hidden">
        <p class="form-hint-small" id="otpMessage">
          A 6-digit verification code was sent to your phone.
        </p>
        <form id="otpForm" class="auth-form">
          <div class="form-row">
            <label for="otpCode">Verification Code</label>
            <input type="text" id="otpCode" inputmode="numeric" maxlength="6"
                   pattern="[0-9]{6}" autocomplete="one-time-code" required>
          </div>
          <button type="submit" class="btn-primary btn-full" id="otpBtn">Verify &amp; Sign In</button>
        </form>
        <p style="text-align:center;margin-top:.75rem;">
          <a href="#" id="resendOtp" class="auth-link" style="font-size:.82rem;">Resend code</a>
          &nbsp;·&nbsp;
          <a href="#" id="backToLogin" class="auth-link" style="font-size:.82rem;">Back</a>
        </p>
      </div>

      <div id="loginMsg" class="alert hidden"></div>

      <div class="tenant-inactive-note" id="tenantInactiveNote">
        <span class="note-icon">🔒</span><strong>This account is currently inactive.</strong>
        Please contact the administrator to reactivate it before signing in.
      </div>

      <div class="auth-footer">
        <a href="/admin/forgot" class="auth-link">Forgot password?</a>
        <a href="/" class="auth-link">← Back to site</a>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const NEXT = params.get('next') || '/';
    // ── Inactive-tenant lockout ──
    const INACTIVE = {{tenant_inactive}} === "1";
    if (INACTIVE) {
      document.body.classList.add('tenant-inactive');
      // Disabled buttons with pointer-events:none don't fire click events,
      // so we attach the click handler to a wrapper that still receives them.
      const loginWrap = document.getElementById('step1');
      const otpWrap   = document.getElementById('step2');
      const note      = document.getElementById('tenantInactiveNote');
      function flashNote(ev) {
        ev.stopPropagation();
        if (note) note.scrollIntoView({behavior: 'smooth', block: 'nearest'});
      }
      // Re-enable clicks at the wrapper level so the note still responds.
      [loginWrap, otpWrap].forEach(w => {
        if (!w) return;
        w.addEventListener('click', (ev) => {
          const tgt = ev.target.closest('button, input, form');
          if (tgt) flashNote(ev);
        }, true);
      });
    }

    // Propagate ?__tenant= to every auth fetch so anonymous requests
    // resolve the right tenant without needing session persistence.
    const TENANT_QS = (() => {
      // 1) Explicit ?__tenant= wins.
      // 2) ?__preview=<slug> also implies the tenant context (preview path).
      // 3) Otherwise read the server-rendered tenant slug from <body>.
      //    This closes the gap where a plain /admin/login (no query string)
      //    rendered the default tenant but accepted other tenants' creds.
      const t = params.get('__tenant') || params.get('__preview');
      if (t) return '?__tenant=' + encodeURIComponent(t);
      const bodySlug = (document.body && document.body.dataset && document.body.dataset.tenantSlug) || '';
      return bodySlug ? '?__tenant=' + encodeURIComponent(bodySlug) : '';
    })();

    const loginForm = document.getElementById('loginForm');
    const otpForm   = document.getElementById('otpForm');
    const msg       = document.getElementById('loginMsg');
    const step1     = document.getElementById('step1');
    const step2     = document.getElementById('step2');

    function showMsg(kind, text) {
      msg.className = 'alert alert-' + kind;
      msg.textContent = text;
      msg.classList.remove('hidden');
    }
    function hideMsg() { msg.classList.add('hidden'); }

    // ── Step 1: password ──
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (INACTIVE) { return; }   // hard stop for inactive tenants
      const btn = document.getElementById('loginBtn');
      btn.disabled = true; btn.textContent = 'Signing in…';
      hideMsg();
      try {
        const r = await fetch('/api/admin/login' + TENANT_QS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value,
          }),
        });
        const d = await r.json();
        if (r.ok && d.ok && d.requires_2fa) {
          // 2FA required — show OTP step
          step1.classList.add('hidden');
          step2.classList.remove('hidden');
          if (d.message) document.getElementById('otpMessage').textContent = d.message;
          document.getElementById('otpCode').focus();
        } else if (r.ok && d.ok) {
          // Regular login (no 2FA)
          showMsg('success', '✅ Signed in. Redirecting…');
          setTimeout(() => { location.href = NEXT + TENANT_QS; }, 500);
        } else {
          showMsg('error', d.error || 'Login failed.');
          btn.disabled = false; btn.textContent = 'Sign In';
        }
      } catch {
        showMsg('error', 'Network error.');
        btn.disabled = false; btn.textContent = 'Sign In';
      }
    });

    // ── Step 2: OTP ──
    otpForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('otpBtn');
      btn.disabled = true; btn.textContent = 'Verifying…';
      hideMsg();
      try {
        const r = await fetch('/api/admin/login/verify-otp' + TENANT_QS, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ otp: document.getElementById('otpCode').value.trim() }),
        });
        const d = await r.json();
        if (r.ok && d.ok) {
          showMsg('success', '✅ Signed in. Redirecting…');
          setTimeout(() => { location.href = NEXT + TENANT_QS; }, 500);
        } else {
          showMsg('error', d.error || 'Verification failed.');
          btn.disabled = false; btn.textContent = 'Verify & Sign In';
        }
      } catch {
        showMsg('error', 'Network error.');
        btn.disabled = false; btn.textContent = 'Verify & Sign In';
      }
    });

    // ── Resend OTP ──
    document.getElementById('resendOtp').addEventListener('click', async (e) => {
      e.preventDefault();
      hideMsg();
      try {
        const r = await fetch('/api/admin/login/resend-otp' + TENANT_QS, { method: 'POST' });
        const d = await r.json();
        if (r.ok && d.ok) {
          showMsg('success', d.message || 'Code resent.');
          document.getElementById('otpMessage').textContent = d.message || 'New code sent.';
          document.getElementById('otpCode').value = '';
          document.getElementById('otpCode').focus();
        } else {
          showMsg('error', d.error || 'Could not resend.');
        }
      } catch { showMsg('error', 'Network error.'); }
    });

    // ── Back to password step ──
    document.getElementById('backToLogin').addEventListener('click', (e) => {
      e.preventDefault();
      step2.classList.add('hidden');
      step1.classList.remove('hidden');
      document.getElementById('otpCode').value = '';
      hideMsg();
      const btn = document.getElementById('loginBtn');
      btn.disabled = false; btn.textContent = 'Sign In';
    });
  </script>
</body>
</html>

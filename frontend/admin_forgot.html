<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – Simon Fresh Water</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-body">
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo-drop">💧</div>
        <h1>Simon Fresh Water</h1>
        <p>Password Reset</p>
      </div>

      <!-- STEP 1: request OTP -->
      <div id="step1">
        <p class="form-hint-small">
          Enter your admin username or recovery phone. We'll send a 6-digit
          code via SMS.
        </p>
        <form id="forgotForm" class="auth-form">
          <div class="form-row">
            <label for="identifier">Username or Phone</label>
            <input type="text" id="identifier" required>
          </div>
          <button type="submit" class="btn-primary btn-full" id="forgotBtn">Send Reset Code</button>
        </form>
      </div>

      <!-- STEP 2: verify OTP + set new password -->
      <div id="step2" class="hidden">
        <p class="form-hint-small">
          Enter the 6-digit code sent to your phone, then choose a new password.
        </p>
        <div id="countdown" class="form-hint-small"
             style="color:#c62828; font-weight:700; margin-bottom:.6rem;"></div>
        <form id="resetForm" class="auth-form">
          <div class="form-row">
            <label for="otp">6-Digit Code</label>
            <input type="text" id="otp" inputmode="numeric" maxlength="6"
                   pattern="[0-9]{6}" required placeholder="123456">
          </div>
          <div class="form-row">
            <label for="newPassword">New Password (min 8 chars)</label>
            <input type="password" id="newPassword" minlength="8"
                   autocomplete="new-password" required>
          </div>
          <button type="submit" class="btn-primary btn-full" id="resetBtn">Reset Password</button>
        </form>
        <p style="text-align:center; margin-top:.75rem;">
          <a href="#" id="startOver" class="auth-link" style="font-size:.82rem;">← Start over</a>
        </p>
      </div>

      <div id="forgotMsg" class="alert hidden"></div>

      <div class="auth-footer">
        <a href="/admin/login" class="auth-link">← Back to sign in</a>
      </div>
    </div>
  </main>

  <script>
    // localStorage survives Android Chrome killing the tab.
    const LS_TOKEN_KEY  = 'sfw_pwResetToken';
    const LS_EXPIRY_KEY = 'sfw_pwResetExpiry';
    let RESET_TOKEN = null;
    let countdownTimer = null;

    function showMsg(kind, text) {
      const msg = document.getElementById('forgotMsg');
      msg.className = 'alert alert-' + kind;
      msg.textContent = text;
      msg.classList.remove('hidden');
    }
    function hideMsg() {
      document.getElementById('forgotMsg').classList.add('hidden');
    }

    function saveToken(token) {
      RESET_TOKEN = token;
      const expiry = Date.now() + (5 * 60 * 1000);
      localStorage.setItem(LS_TOKEN_KEY, token);
      localStorage.setItem(LS_EXPIRY_KEY, String(expiry));
    }

    function clearToken() {
      RESET_TOKEN = null;
      localStorage.removeItem(LS_TOKEN_KEY);
      localStorage.removeItem(LS_EXPIRY_KEY);
      if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
    }

    function restoreToken() {
      const saved  = localStorage.getItem(LS_TOKEN_KEY);
      const expiry = parseInt(localStorage.getItem(LS_EXPIRY_KEY) || '0', 10);
      if (saved && expiry > Date.now()) {
        RESET_TOKEN = saved;
        showStep2();
        startCountdown(expiry);
        return true;
      }
      clearToken();
      return false;
    }

    function showStep2() {
      document.getElementById('step1').classList.add('hidden');
      document.getElementById('step2').classList.remove('hidden');
    }
    function showStep1() {
      document.getElementById('step1').classList.remove('hidden');
      document.getElementById('step2').classList.add('hidden');
    }

    function startCountdown(expiryMs) {
      if (countdownTimer) clearInterval(countdownTimer);
      const el = document.getElementById('countdown');
      function tick() {
        const left = expiryMs - Date.now();
        if (left <= 0) {
          clearInterval(countdownTimer);
          countdownTimer = null;
          clearToken();
          el.textContent = '⏰ Code expired. Please request a new one.';
          showStep1();
          return;
        }
        const s = Math.floor(left / 1000);
        const mm = String(Math.floor(s / 60)).padStart(2, '0');
        const ss = String(s % 60).padStart(2, '0');
        el.textContent = `⏰ Code expires in ${mm}:${ss}`;
      }
      tick();
      countdownTimer = setInterval(tick, 1000);
    }

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('forgotBtn');
      btn.disabled = true; btn.textContent = 'Sending…';
      hideMsg();
      try {
        const r = await fetch('/api/admin/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier: document.getElementById('identifier').value.trim() }),
        });
        const data = await r.json();
        if (r.ok && data.ok) {
          showMsg(data.sms_ok ? 'success' : 'error', data.message);
          if (data.token) {
            saveToken(data.token);
            showStep2();
            startCountdown(parseInt(localStorage.getItem(LS_EXPIRY_KEY), 10));
          }
        } else {
          showMsg('error', data.error || 'Request failed.');
        }
      } catch { showMsg('error', 'Network error.'); }
      finally { btn.disabled = false; btn.textContent = 'Send Reset Code'; }
    });

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!RESET_TOKEN) {
        showMsg('error', 'Reset session expired. Please request a new code.');
        showStep1();
        return;
      }
      const btn = document.getElementById('resetBtn');
      btn.disabled = true; btn.textContent = 'Resetting…';
      hideMsg();
      try {
        const r = await fetch('/api/admin/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: RESET_TOKEN,
            otp: document.getElementById('otp').value.trim(),
            new_password: document.getElementById('newPassword').value,
          }),
        });
        const data = await r.json();
        if (r.ok && data.ok) {
          clearToken();
          showMsg('success', '✅ ' + data.message);
          setTimeout(() => { location.href = '/admin/login'; }, 1200);
        } else {
          showMsg('error', data.error || 'Reset failed.');
          btn.disabled = false; btn.textContent = 'Reset Password';
        }
      } catch {
        showMsg('error', 'Network error.');
        btn.disabled = false; btn.textContent = 'Reset Password';
      }
    });

    document.getElementById('startOver').addEventListener('click', (e) => {
      e.preventDefault();
      clearToken();
      hideMsg();
      showStep1();
    });

    // On load: restore an in-progress reset from localStorage
    restoreToken();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk SMS — {{brand_name}}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{brand_favicon_url}}?v={{tenant_slug}}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{brand_favicon_url}}?size=192&v={{tenant_slug}}">
  <link rel="shortcut icon" href="{{brand_favicon_url}}?v={{tenant_slug}}">
  <link rel="apple-touch-icon" href="{{brand_favicon_url}}?size=192&v={{tenant_slug}}">
  <link rel="manifest" href="/manifest.webmanifest?__tenant={{tenant_slug}}">
  <meta name="theme-color" content="#0d47a1">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="settings-body" data-tenant-slug="{{tenant_slug}}">
  <main class="settings-wrap" style="max-width: 860px;">

    <a href="/?__tenant={{tenant_slug}}" class="brand-link" aria-label="Go to home">
      <div class="settings-header">
        <img class="brand-logo" src="{{brand_logo_url}}" alt="{{brand_name}}">
        <div class="settings-brand-text">
          <h1>{{brand_name}}</h1>
          <p>Bulk SMS to Overdue Consumers</p>
        </div>
      </div>
    </a>

    <!-- Controls -->
    <div class="settings-card">
      <h2>🎯 Filter</h2>
      <label style="display:flex;align-items:center;gap:.5rem;font-size:.9rem;margin-bottom:.6rem;">
        <input type="checkbox" id="includeDue">
        Include <strong>DUE</strong> (not yet overdue) consumers
      </label>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
        <button id="refreshBtn" class="btn-secondary" type="button">↻ Refresh List</button>
        <button id="selectAllBtn" class="btn-secondary" type="button">Select All</button>
        <button id="deselectAllBtn" class="btn-secondary" type="button">Deselect All</button>
      </div>
      <div id="listMsg" class="alert hidden" style="margin-top:.75rem;"></div>
    </div>

    <!-- Consumer list -->
    <div class="settings-card">
      <h2>👥 Overdue Consumers <span id="countBadge" style="font-weight:400;color:#90a4ae;font-size:.85rem;"></span></h2>
      <div id="listWrap">Loading…</div>
    </div>

    <!-- Send action -->
    <div class="settings-card">
      <h2>📤 Send Reminder</h2>
      <p class="form-hint-small" style="margin-bottom:.6rem;">
        Each recipient gets their own personalised bill-reminder (with their
        name, meter no., and outstanding balance).
      </p>

      <!-- Preview channel toggle -->
      <div id="previewToggleRow" style="display:none;margin-bottom:.5rem;gap:.35rem;align-items:center;">
        <span style="font-size:.78rem;color:#666;font-weight:600;">Preview:</span>
        <button type="button" id="previewSmsBtn" class="btn-secondary" style="font-size:.75rem;padding:.3rem .7rem;background:#1976d2;color:#fff;border-color:#1976d2;">SMS</button>
        <button type="button" id="previewWaBtn" class="btn-secondary" style="font-size:.75rem;padding:.3rem .7rem;">WhatsApp</button>
      </div>

      <div id="previewBox" style="background:#f5faff;border:1px solid #bbdefb;border-radius:6px;padding:.7rem .9rem;font-size:.82rem;color:#1c2b36;white-space:pre-line;margin-bottom:.8rem;">
        Select consumers above to preview the message.
      </div>

      <div style="display:flex;gap:.5rem;flex-wrap:wrap;">
        <button id="sendBtn" class="btn-primary" type="button" disabled>
          <span class="btn-icon">📢</span> Send SMS to Selected
        </button>
        <button id="sendWaBtn" class="btn-primary" type="button" disabled style="display:none;background:#25D366;border-color:#1ea855;">
          <span class="btn-icon">📱</span> Send WhatsApp to Selected
        </button>
      </div>
      <div id="sendMsg" class="alert hidden" style="margin-top:.75rem;"></div>
      <div id="sendResults" style="margin-top:.75rem;"></div>
    </div>

    <div class="settings-back">
      <a href="/?__tenant={{tenant_slug}}">← Back to Home</a>
    </div>
  </main>

  <script>
    const MAX_BATCH = 30;

    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s == null ? '' : String(s);
      return d.innerHTML;
    }
    function fmt(n) {
      return Number(n).toLocaleString('en-KE', {
        minimumFractionDigits: 2, maximumFractionDigits: 2,
      });
    }
    function showMsg(el, kind, text) {
      el.className = 'alert alert-' + kind;
      el.textContent = text;
      el.classList.remove('hidden');
    }
    function hide(el) { el.classList.add('hidden'); }

    let CONSUMERS = [];
    let SELECTED = new Set();
    let WHATSAPP_AVAILABLE = false;
    let PREVIEW_CHANNEL = 'sms';   // 'sms' | 'whatsapp'

    async function loadList() {
      const wrap = document.getElementById('listWrap');
      const badge = document.getElementById('countBadge');
      const msg = document.getElementById('listMsg');
      hide(msg);
      wrap.textContent = 'Loading…';

      const includeDue = document.getElementById('includeDue').checked ? '1' : '0';
      try {
        const r = await fetch(`/api/admin/bulk_sms/overdue?include_due=${includeDue}`,
                              { credentials: 'same-origin' });
        if (r.status === 401) { location.href = (window.adminLoginUrl && window.adminLoginUrl('/admin/bulk_sms')) || '/admin/login?next=/admin/bulk_sms'; return; }
        const d = await r.json();
        CONSUMERS = d.consumers || [];
        SELECTED.clear();
        badge.textContent = `(${CONSUMERS.length})`;

        // Populate WhatsApp availability from response
        WHATSAPP_AVAILABLE = d.whatsapp_available === true;
        _applyWhatsAppAvailability();

        if (CONSUMERS.length === 0) {
          wrap.innerHTML = '<p class="form-hint-small">No consumers match this filter.</p>';
          updateSendButton();
          return;
        }

        wrap.innerHTML = `
          <div class="table-wrap">
            <table class="readings-table">
              <thead>
                <tr>
                  <th style="width:36px;"></th>
                  <th>Customer</th>
                  <th>Meter No.</th>
                  <th>Contact</th>
                  <th>Status</th>
                  <th class="right">Outstanding (KES)</th>
                </tr>
              </thead>
              <tbody>
                ${CONSUMERS.map(c => `
                  <tr>
                    <td><input type="checkbox" class="row-check" data-id="${c.id}"></td>
                    <td>${esc(c.cust_name)}</td>
                    <td>${esc(c.meter_acc_no)}</td>
                    <td>${esc(c.contact || '—')}</td>
                    <td>${esc(c.status_label)}</td>
                    <td class="right">${fmt(c.total_due)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
        `;

        wrap.querySelectorAll('.row-check').forEach(cb => {
          cb.addEventListener('change', (e) => {
            const id = parseInt(e.currentTarget.getAttribute('data-id'), 10);
            if (e.currentTarget.checked) {
              if (SELECTED.size >= MAX_BATCH) {
                e.currentTarget.checked = false;
                showMsg(msg, 'error', `Max ${MAX_BATCH} per batch. Deselect one first.`);
                return;
              }
              SELECTED.add(id);
            } else {
              SELECTED.delete(id);
            }
            updateSendButton();
          });
        });
        updateSendButton();
      } catch {
        wrap.textContent = 'Failed to load list.';
      }
    }

    function _applyWhatsAppAvailability() {
      const waBtn = document.getElementById('sendWaBtn');
      const toggleRow = document.getElementById('previewToggleRow');
      if (WHATSAPP_AVAILABLE) {
        waBtn.style.display = '';
        toggleRow.style.display = 'flex';
      } else {
        waBtn.style.display = 'none';
        toggleRow.style.display = 'none';
        // Force SMS preview if WA not available
        PREVIEW_CHANNEL = 'sms';
      }
    }

    function _updatePreviewChannelButtons() {
      const smsBtn = document.getElementById('previewSmsBtn');
      const waBtn = document.getElementById('previewWaBtn');
      if (!smsBtn || !waBtn) return;
      if (PREVIEW_CHANNEL === 'sms') {
        smsBtn.style.background = '#1976d2'; smsBtn.style.color = '#fff'; smsBtn.style.borderColor = '#1976d2';
        waBtn.style.background = ''; waBtn.style.color = ''; waBtn.style.borderColor = '';
      } else {
        waBtn.style.background = '#25D366'; waBtn.style.color = '#fff'; waBtn.style.borderColor = '#1ea855';
        smsBtn.style.background = ''; smsBtn.style.color = ''; smsBtn.style.borderColor = '';
      }
    }

    function updateSendButton() {
      const btn = document.getElementById('sendBtn');
      const waBtn = document.getElementById('sendWaBtn');
      const preview = document.getElementById('previewBox');
      const n = SELECTED.size;

      if (n === 0) {
        btn.disabled = true;
        btn.innerHTML = '<span class="btn-icon">📢</span> Send SMS to Selected';
        if (waBtn) {
          waBtn.disabled = true;
          waBtn.innerHTML = '<span class="btn-icon">📱</span> Send WhatsApp to Selected';
        }
        preview.textContent = 'Select consumers above to preview the message.';
        return;
      }

      btn.disabled = false;
      btn.innerHTML = `<span class="btn-icon">📢</span> Send SMS to ${n} selected`;
      if (waBtn) {
        waBtn.disabled = false;
        waBtn.innerHTML = `<span class="btn-icon">📱</span> Send WhatsApp to ${n} selected`;
      }

      // Show one example message based on selected preview channel
      const first = CONSUMERS.find(c => SELECTED.has(c.id));
      if (first) {
        if (PREVIEW_CHANNEL === 'whatsapp' && first.preview_body_wa) {
          preview.textContent = first.preview_body_wa;
        } else {
          preview.textContent = first.preview_body || (
            `Dear ${first.cust_name},\n` +
            `Your water bill (${first.meter_acc_no}) status: ${first.status_label}. ` +
            `Outstanding: KES ${fmt(first.total_due)}. ` +
            `Pay via Paybill ${first.paybill || '—'}, Acc ${first.payment_account || first.meter_acc_no}. Thank you.`
          );
        }
      }
      _updatePreviewChannelButtons();
    }

    async function sendBulk(channel) {
      const btn = document.getElementById('sendBtn');
      const waBtn = document.getElementById('sendWaBtn');
      const msg = document.getElementById('sendMsg');
      const res = document.getElementById('sendResults');
      hide(msg);
      res.innerHTML = '';

      const ids = Array.from(SELECTED);
      if (ids.length === 0) return;
      const chLabel = channel === 'whatsapp' ? 'WhatsApp' : 'SMS';
      if (!confirm(`Send ${chLabel} to ${ids.length} consumer(s)? This action cannot be undone.`)) return;

      const _disableBtns = () => { btn.disabled = true; if (waBtn) waBtn.disabled = true; };
      const _enableBtns  = () => { btn.disabled = false; if (waBtn) waBtn.disabled = false; };
      _disableBtns();
      const sender = channel === 'whatsapp' ? waBtn : btn;
      sender.innerHTML = '<span class="btn-icon">⏳</span> Sending…';

      try {
        const r = await fetch('/api/admin/bulk_sms/send', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ consumer_ids: ids, channel: channel }),
        });
        const d = await r.json();

        if (r.status === 401) { location.href = (window.adminLoginUrl && window.adminLoginUrl('/admin/bulk_sms')) || '/admin/login?next=/admin/bulk_sms'; return; }

        if (!r.ok || d.error) {
          showMsg(msg, 'error', '❌ ' + (d.error || 'Send failed.'));
          _enableBtns();
          updateSendButton();
          return;
        }

        const color = d.failed === 0 ? 'success' : 'error';
        showMsg(msg, color,
          `✅ Sent ${d.sent} via ${chLabel} · ❌ Failed ${d.failed}` +
          (d.skipped_ids ? ` · Skipped ${d.skipped_ids.length}` : ''));

        res.innerHTML = `
          <div style="border:1px solid #eef1f5;border-radius:6px;background:#fff;max-height:280px;overflow-y:auto;">
            ${(d.results || []).map(x => `
              <div style="padding:.5rem .8rem;border-bottom:1px solid #f5f5f5;display:flex;justify-content:space-between;gap:.5rem;font-size:.85rem;">
                <div>
                  <strong>${esc(x.cust_name)}</strong>
                  <span style="color:#90a4ae;">· ${esc(x.meter_acc_no)}</span>
                </div>
                <div style="color:${x.ok ? '#2e7d32' : '#c62828'};font-weight:600;">
                  ${x.ok ? '✓ sent' : '✗ ' + esc(x.error || 'failed')}
                </div>
              </div>`).join('')}
          </div>`;
        SELECTED.clear();
        // Deselect UI checkboxes
        document.querySelectorAll('.row-check').forEach(cb => { cb.checked = false; });
        updateSendButton();
      } catch (e) {
        showMsg(msg, 'error', '❌ Network error.');
      } finally {
        _enableBtns();
        updateSendButton();
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadList);
    document.getElementById('includeDue').addEventListener('change', loadList);

    document.getElementById('selectAllBtn').addEventListener('click', () => {
      const boxes = Array.from(document.querySelectorAll('.row-check'));
      const max = Math.min(boxes.length, MAX_BATCH);
      boxes.slice(0, max).forEach(cb => {
        cb.checked = true;
        SELECTED.add(parseInt(cb.getAttribute('data-id'), 10));
      });
      boxes.slice(max).forEach(cb => { cb.checked = false; });
      updateSendButton();
    });

    document.getElementById('deselectAllBtn').addEventListener('click', () => {
      document.querySelectorAll('.row-check').forEach(cb => { cb.checked = false; });
      SELECTED.clear();
      updateSendButton();
    });

    document.getElementById('sendBtn').addEventListener('click', () => sendBulk('sms'));
    document.getElementById('sendWaBtn').addEventListener('click', () => sendBulk('whatsapp'));

    // Preview channel toggle
    document.getElementById('previewSmsBtn').addEventListener('click', () => {
      PREVIEW_CHANNEL = 'sms';
      updateSendButton();
    });
    document.getElementById('previewWaBtn').addEventListener('click', () => {
      if (!WHATSAPP_AVAILABLE) return;
      PREVIEW_CHANNEL = 'whatsapp';
      updateSendButton();
    });

    // Initial load
    loadList();
  </script>
  <script src="/tenant-watchdog.js"></script>
</body>
</html>
